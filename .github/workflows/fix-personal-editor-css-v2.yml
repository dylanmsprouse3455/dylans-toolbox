name: Fix Personal editor CSS structure

on:
  push:
    branches: [fix-personal-editor-css-structure]
    paths:
      - 'scripts/fix-personal-editor-css-v2.mjs'
      - '.github/workflows/fix-personal-editor-css-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-personal-editor-css-structure
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/fix-personal-editor-css-v2.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit CSS only
        run: |
          rm scripts/fix-personal-editor-css-v2.mjs .github/workflows/fix-personal-editor-css-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/toolbox.css scripts/fix-personal-editor-css-v2.mjs .github/workflows/fix-personal-editor-css-v2.yml
          git commit -m "Fix Personal editor CSS structure"
          git push origin HEAD:fix-personal-editor-css-structure
