name: Check Work Wizard
on:
  push:
    branches: [work-confirmation-wizard]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Work response type fix once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/work-toolbox.tsx')
          s=p.read_text()
          old="type WorkResponse=(WorkPreviewReceipt|WorkCommitReceipt|WorkAnswer|{discarded:true}|{error:string;kind?:string;turn_id?:string;revision?:number;preview?:WorkPreviewReceipt['preview']})&{error?:string};"
          new="type WorkResponse={kind?:'work_preview'|'work_commit'|'work_answer';turn_id?:string;revision?:number;preview?:WorkPreviewReceipt['preview'];answer?:string;reply?:string;case_ids?:string[];cases?:WorkCase[];discarded?:boolean;error?:string};"
          if old in s:
              p.write_text(s.replace(old,new))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/work-toolbox.tsx
            git commit -m "Fix Work response result typing"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
