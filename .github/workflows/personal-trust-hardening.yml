name: Personal trust hardening
on:
  push:
    branches: [personal-trust-hardening]
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-trust-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python scripts/apply-personal-trust-hardening.py
      - run: rm scripts/apply-personal-trust-hardening.py .github/workflows/personal-trust-hardening.yml
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
      - name: Commit checked changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Personal surfacing, connections, and recovery"
          git push origin HEAD:personal-trust-hardening
