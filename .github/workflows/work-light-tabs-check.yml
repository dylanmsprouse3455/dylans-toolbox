name: Check Light Work Tabs
on:
  push:
    branches: [work-bottom-tabs-light-ui]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved light Work design once
        run: |
          python scripts/apply-work-light-tabs.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/work-toolbox.tsx app/work-toolbox.css
            git commit -m "Apply approved light Work tabs design"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
