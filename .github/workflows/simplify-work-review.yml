name: Simplify Work review
on:
  push:
    branches: [simplify-work-review]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-work-review
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python scripts/simplify_work_review.py
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/work-toolbox.tsx app/work-toolbox.css tests/work-wizard-ui.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify Work confirmation review"
          git push origin HEAD:simplify-work-review
