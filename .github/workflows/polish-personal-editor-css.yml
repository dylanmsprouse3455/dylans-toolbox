name: Polish Personal editor CSS

on:
  push:
    branches: [polish-personal-editor-css]
    paths:
      - 'scripts/polish-personal-editor-css.mjs'
      - '.github/workflows/polish-personal-editor-css.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-personal-editor-css
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/polish-personal-editor-css.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit CSS only
        run: |
          rm scripts/polish-personal-editor-css.mjs .github/workflows/polish-personal-editor-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/toolbox.css scripts/polish-personal-editor-css.mjs .github/workflows/polish-personal-editor-css.yml
          git commit -m "Polish Personal editor CSS"
          git push origin HEAD:polish-personal-editor-css
