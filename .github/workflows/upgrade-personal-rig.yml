name: Upgrade Personal rig

on:
  push:
    branches: [personal-rig-upgrades]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply upgrade patch
        run: |
          python3 scripts/upgrade-personal-rig.py
          python3 scripts/fix-personal-rig-build.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation only
        run: |
          rm scripts/upgrade-personal-rig.py scripts/fix-personal-rig-build.py .github/workflows/upgrade-personal-rig.yml
          git config user.name dylanmsprouse3455
          git config user.email dylanm.sprouse3455@gmail.com
          git add app/toolbox.tsx app/toolbox.css lib/items.ts lib/capture-schema.ts lib/conversation.ts lib/capture-handler.ts supabase/personal-attention-v2.sql tests/personal-attention-v2.test.ts tests/conversation.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add Personal waiting, autopilot, dump, and undo"
          git push origin HEAD:personal-rig-upgrades
