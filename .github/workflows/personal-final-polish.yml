name: Personal final polish
on:
  push:
    branches: [personal-mode-refresh]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-mode-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python scripts/personal_final_polish.py
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/toolbox.tsx app/toolbox.css lib/items.ts supabase/personal-item-history.sql supabase/personal-open-metadata.sql supabase/schema.sql tests/personal-mode.test.ts tests/personal-ui.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish Personal mode polish"
          git push origin HEAD:personal-mode-refresh
