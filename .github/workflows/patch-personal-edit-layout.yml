name: Patch Personal editor layout
on:
  push:
    branches: [fix-personal-edit-layout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/patch-personal-edit-layout.mjs
      - run: grep -q 'item-edit-form' app/toolbox.tsx && grep -q 'Compact Personal item editor' app/toolbox.css
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Compact Personal item editor"
            git push
          fi
