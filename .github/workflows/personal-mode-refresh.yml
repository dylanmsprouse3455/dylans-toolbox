name: Personal mode refresh
on:
  push:
    branches: [personal-mode-refresh]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-mode-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python scripts/personal_mode_refresh.py
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOLBOX_BASE_PATH: /dylans-toolbox/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/toolbox.tsx app/toolbox.css lib/items.ts lib/capture-schema.ts lib/conversation.ts lib/capture-handler.ts lib/local.ts lib/supabase.ts supabase/schema.sql tests/personal-mode.test.ts tests/personal-ui.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Personal mode"
          git push origin HEAD:personal-mode-refresh
